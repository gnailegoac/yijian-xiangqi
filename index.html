<!doctype html>
<html lang="zh-CN" data-theme="chibi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#0b0f1d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="弈间">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>弈间 · 中国象棋</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/themes.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/board.css">
<link rel="stylesheet" href="./styles/fx.css">
<link rel="stylesheet" href="./styles/buddy.css">
<link rel="stylesheet" href="./styles/chat.css">
<link rel="stylesheet" href="./styles/hud.css">
<script type="module" src="./src/app.js"></script>
<script>
// The game is built by the module above. When it does not come up (a module request failed on the way, or the start
// threw before anything was drawn), the empty board below would look like loading for ever: one line says so and
// reloads the page. src/app.js calls window.__bootFailed for a fault before its stage exists.
(function () {
  var doc = document, line = null;
  function up() {                                   // the stage has drawn its first nodes, or the game says it is ready
    var overlays = doc.getElementById('overlays');
    return doc.documentElement.hasAttribute('data-ready') || (overlays !== null && overlays.childElementCount > 0);
  }
  function tell() {
    if (line) return;
    if (!doc.body) { doc.addEventListener('DOMContentLoaded', tell); return; }
    line = doc.createElement('div');
    line.className = 'boot-fail';
    line.setAttribute('role', 'alert');
    var button = doc.createElement('button');
    button.type = 'button';
    button.className = 'boot-fail__reload';
    button.textContent = '棋局没能打开，点这里重新加载';
    button.addEventListener('click', function () { location.reload(); });
    line.appendChild(button);
    doc.body.appendChild(line);
  }
  window.__bootFailed = tell;
  var entry = doc.querySelector('script[type="module"]');
  if (entry) entry.addEventListener('error', tell);
  // The backstop looks at what the page shows, not at the clock alone: a start that is slow but healthy has drawn the
  // stage long before, and a page that comes up after all takes the line away again.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (up()) return;
      tell();
      var watch = setInterval(function () {
        if (!up()) return;
        clearInterval(watch);
        if (line) line.remove();
        line = null;
      }, 1000);
    }, 8000);
  });
})();
</script>
</head>
<body>
<div id="app" class="app" data-layout="landscape" data-phase="boot" data-ply="0" data-kb="0" data-sheet="0" data-coach="local">
  <header id="topbar" class="topbar"></header>            <!-- hud.js: menu, 司马懿 plate, round, trophies, mute -->
  <main id="stage" class="stage"><div id="board"></div></main>   <!-- board-view.js (+ fx inside) -->
  <div id="underbar" class="underbar"></div>               <!-- hud.js: #undo-button — always the element directly under the board -->
  <section id="coach" class="coach" aria-label="军师">
    <div id="buddy" class="coach__buddy"></div>            <!-- buddy.js: 诸葛亮 + bubble -->
    <div id="chat" class="coach__chat"></div>              <!-- chat-panel.js: chips, ✎, 回看, input, history sheet -->
  </section>
  <div id="actions" class="actions"></div>                 <!-- hud.js: 锦囊 | 换一步 + 确定落子 | 再来一局 -->
  <div id="overlays"></div>                                <!-- hud.js: sheets, dialogs, toasts, start and game-over cards -->
</div>
<noscript><p class="noscript">请开启 JavaScript 后开始对弈。</p></noscript>
</body>
</html>
