<!doctype html>
<html lang="zh-CN" data-theme="chibi" data-motion="reduced">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1d">
<title>弈间 · 军乐台 (audio.js)</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/themes.css">
<style>
/* Dev harness for src/ui/audio.js and src/ui/speech.js (package X4). Not part of the game: never built into dist/.
 *
 *   audio.html              the sound desk: a pad for every effect, the music bed, every switch of the engine,
 *                           read-aloud, and a level meter on the real output
 *   audio.html?measure=1    the measuring bench: renders every recipe, the music bed and the worst-case mixes
 *                           through OfflineAudioContext and prints peak, length and loudness next to the contract;
 *                           it also proves the two rules of CONTRACT-NOTES K-98: nothing, however it is stacked,
 *                           reaches 0 dBFS (the soft limiter), and the bed is no louder at high tension
 *
 * X4 has no stylesheet of its own (sound has no look), so this page carries its styles inline. */

html { height: 100%; }
body { min-height: 100%; overscroll-behavior: none; }

.desk {
  /* "all is well" green that reads on the chrome of every theme (the themes' own greens are made for their boards) */
  --calm: color-mix(in srgb, var(--arrow-idea) 60%, var(--ink));
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-content: start;
  gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  color: var(--ink);
  background:
    radial-gradient(75% 46% at 50% 106%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 100%),
    radial-gradient(80% 50% at 78% -14%, var(--surface-2), transparent 100%),
    var(--page);
  background-attachment: fixed;
}

/* ---- top bar -------------------------------------------------------------------------------------------------------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.seal {
  flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  font: 700 26px/1 var(--font-kai); color: var(--red-glyph);
  background: radial-gradient(circle at 35% 30%, var(--red-a), var(--red-b) 60%, var(--red-c));
  box-shadow: inset 0 0 0 2px var(--red-rim), 0 3px 0 var(--piece-edge);
}
.brand h1 { margin: 0; font: 700 26px/1.1 var(--font-kai); letter-spacing: .08em; white-space: nowrap; }
.brand p { margin: 2px 0 0; font-size: 12px; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }

.seg { display: inline-flex; padding: 2px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
.seg button {
  min-width: 48px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px;
  background: transparent; color: var(--ink-2); font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg--wide { display: flex; }
.seg--wide button { flex: 1; padding: 0 6px; }
.anchors button { min-width: 0; padding: 0 2px; font-size: 14px; }

.pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); font-weight: 700; font-size: 14px; white-space: nowrap;
}
.pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-2); }
.pill[data-state="running"] i { background: var(--calm); box-shadow: 0 0 0 4px color-mix(in srgb, var(--calm) 25%, transparent); }
.pill[data-state="muted"] i { background: var(--danger); }
.pill[data-state="suspended"] i { background: var(--accent); }

/* ---- buttons -------------------------------------------------------------------------------------------------------- */
.btn {
  min-height: 44px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--edge);
  background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: var(--fs-button); cursor: pointer; white-space: nowrap;
}
.btn:active { transform: translateY(2px); }
.btn--primary {
  border-color: transparent; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000);
}
.btn--primary:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn--danger { border-color: transparent; background: var(--danger); color: var(--danger-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--danger) 55%, #000); }
.btn--danger:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--danger) 55%, #000); }
.btn[aria-pressed="true"] { border-color: transparent; background: var(--accent); color: var(--accent-ink); }
:root[data-motion="full"] .btn { transition: transform 60ms var(--e-out), box-shadow 60ms var(--e-out); }

/* a switch: the whole row is the button */
.sw {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 44px; padding: 4px 2px;
  border: 0; background: transparent; color: var(--ink); font-weight: 600; font-size: 15px; text-align: left; cursor: pointer;
}
.sw small { display: block; font-weight: 400; font-size: 12px; line-height: 1.25; color: var(--ink-2); }
.sw::after {
  content: ""; flex: none; width: 50px; height: 30px; border-radius: 15px;
  background: radial-gradient(circle at 15px 15px, var(--ink-2) 0 11px, transparent 11.5px), var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--edge);
}
.sw[aria-pressed="true"]::after {
  background: radial-gradient(circle at 35px 15px, var(--accent-ink) 0 11px, transparent 11.5px), var(--accent);
  box-shadow: none;
}

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), var(--surface-2) var(--fill, 50%)); box-shadow: inset 0 0 0 1px var(--edge); }
input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--edge); }
input[type="range"]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000);
}
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }

/* ---- cards ---------------------------------------------------------------------------------------------------------- */
.card {
  min-width: 0; padding: 12px 14px 14px; border-radius: var(--r-card);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), 0 3px 0 color-mix(in srgb, var(--edge) 45%, #000);
}
.card > h2, .group > h2 {
  display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px;
  font: 700 19px/1.2 var(--font-kai); letter-spacing: .06em;
}
.card > h2::before, .group > h2::before { content: ""; flex: none; align-self: center; width: 6px; height: 18px; border-radius: 3px; background: var(--accent); }
.card > h2 small, .group > h2 small { font: 400 12px/1.2 var(--font-ui); letter-spacing: 0; color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.card > * + .row, .card > * + .field, .card > * + .seg, .card > * + .sw { margin-top: 8px; }
.field .seg { margin-top: 4px; }
.field label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 1.3; color: var(--ink-2); }
.field label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.note { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--ink-2); }
.code { font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); }

/* ---- level meter ---------------------------------------------------------------------------------------------------- */
.meter { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.meter b { font: 700 12px/1 var(--font-ui); color: var(--ink-2); text-align: center; }
.meter__track {
  position: relative; height: 16px; border-radius: 8px; overflow: hidden;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--edge);
}
.meter__fill {
  position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--v, 0) * 100%) 0 0);
  /* -60 dB .. 0 dB: calm below -18, warm to -6, hot above */
  background: linear-gradient(90deg, var(--calm) 0 70%, var(--fx-spark) 70% 90%, var(--danger) 90% 100%);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px);
}
.meter__hold { position: absolute; top: 0; bottom: 0; left: calc(var(--h, 0) * 100%); width: 3px; margin-left: -3px; border-radius: 2px; background: var(--ink); opacity: var(--ho, 0); }
:root[data-motion="full"] .meter__fill { transition: clip-path 60ms linear; }
.meter__scale { grid-column: 2; position: relative; height: 14px; font: 600 10px/14px var(--font-ui); color: var(--ink-2); }
.meter__scale span { position: absolute; transform: translateX(-50%); }
.meter__scale span:first-child { transform: none; }
.meter__scale span:last-child { transform: translateX(-100%); }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.readout .wide { grid-column: 1 / -1; }
.readout div { padding: 6px 8px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.readout dt, .readout .k { display: block; font-size: 11px; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }
.readout .v { display: block; font: 700 18px/1.25 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.readout .v small { font-size: 11px; font-weight: 600; color: var(--ink-2); }
.readout .is-hot .v { color: var(--danger); }
.scope { display: block; width: 100%; height: 52px; margin-top: 10px; border-radius: 10px; background: var(--surface-2); }
:root[data-motion="reduced"] .scope { display: none; }
.last { margin: 8px 0 0; min-height: 18px; font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last b { color: var(--ink); }

/* the call to unlock */
.wake {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 12px; border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 18%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent);
  font-weight: 700; font-size: 15px; line-height: 1.3;
}
.wake small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.wake i { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 18px/1 var(--font-kai); font-style: normal; background: var(--accent); color: var(--accent-ink); }
:root[data-motion="full"] .wake i { animation: wake-beat 1.2s var(--e-inout) infinite; }
@keyframes wake-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }

/* ---- pads ----------------------------------------------------------------------------------------------------------- */
.group + .group { margin-top: 14px; }
.group > h2 { margin-bottom: 8px; }
.group__tools { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 400 12px/1.2 var(--font-ui); letter-spacing: 0; color: var(--ink-2); }
.group__tools input[type="range"] { width: 130px; }
.group__tools b { color: var(--ink); min-width: 52px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.pad {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; column-gap: 10px;
  min-height: 60px; padding: 8px 10px; border-radius: var(--r-btn); border: 1px solid var(--edge);
  background: var(--surface-2); color: var(--ink); text-align: left; cursor: pointer;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--edge) 55%, #000);
}
.pad:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--edge) 55%, #000); }
.pad__glyph {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font: 700 22px/1 var(--font-kai); color: var(--blk-glyph);
  background: radial-gradient(circle at 35% 30%, var(--blk-a), var(--blk-b) 60%, var(--blk-c));
  box-shadow: inset 0 0 0 2px var(--blk-rim), 0 2px 0 var(--piece-edge);
}
.pad--warm .pad__glyph { color: var(--red-glyph); background: radial-gradient(circle at 35% 30%, var(--red-a), var(--red-b) 60%, var(--red-c)); box-shadow: inset 0 0 0 2px var(--red-rim), 0 2px 0 var(--piece-edge); }
.pad__name { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad__code { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 2px; font: 600 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); white-space: nowrap; }
.pad__code em { font: 700 10px/14px var(--font-ui); font-style: normal; padding: 0 5px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); }
.pad__hint { display: block; margin-top: 2px; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.pad.is-hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface-2)); }
:root[data-motion="full"] .pad { transition: transform 60ms var(--e-out), box-shadow 60ms var(--e-out), background-color var(--t-2) var(--e-out); }
:root[data-motion="full"] .pad.is-hit .pad__glyph { animation: pad-pop var(--t-3) var(--e-back); }
@keyframes pad-pop { 0% { transform: scale(.82); } 100% { transform: scale(1); } }
.pad.combo { grid-template-columns: minmax(0, 1fr); min-height: 60px; }
.combo .pad__name { white-space: normal; }

/* ---- log ------------------------------------------------------------------------------------------------------------ */
.log { margin: 0; padding: 0; list-style: none; font: 600 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); min-height: 58px; }
.log li:first-child { color: var(--ink); }

/* ---- layout ---------------------------------------------------------------------------------------------------------
 * .desk > .top, .card--meter, .rack (music, switches, read-aloud, log), .pads
 * The page scrolls and the meter stays in view (sticky); in landscape the meter is fixed above the rack instead. */
.rack, .pads { display: grid; gap: 12px; align-content: start; min-width: 0; }
.pads { display: block; }
.card--meter {
  position: sticky; top: 8px; z-index: 3;
  box-shadow: inset 0 0 0 1px var(--edge), 0 3px 0 color-mix(in srgb, var(--edge) 45%, #000), 0 14px 24px -10px #000a;
}

/* iPad portrait and other wide-but-tall screens: the cards sit two by two */
@media (min-width: 600px) {
  .rack { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card--meter .meterwrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 16px; align-items: start; }
  .card--meter .readout { margin-top: 0; }
  .card--meter .scope { grid-column: 1 / -1; height: 40px; }
}
/* phones: one column; the meter is a compact strip */
@media (max-width: 599.98px) {
  .desk { gap: 10px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  .brand h1 { font-size: 22px; }
  .brand p { display: none; }
  .seg button { padding: 0 9px; font-size: 14px; }
  .card { padding: 10px 12px 12px; }
  .card > h2, .group > h2 { flex-wrap: wrap; row-gap: 2px; }
  .card--meter { top: 6px; padding-top: 10px; }
  .card--meter > h2, .card--meter .scope, .card--meter #vSrcMax { display: none; }
  .card--meter .readout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.9fr); gap: 6px; margin-top: 6px; }
  .card--meter .readout .wide { grid-column: auto; }
  .card--meter .readout div { padding: 4px 6px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
  .card--meter .readout .k { font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
  .card--meter .readout .v { font-size: 14px; }
  .card--meter .last { margin-top: 6px; font-size: 12px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pad { grid-template-columns: 34px minmax(0, 1fr); column-gap: 8px; padding: 8px; }
  .pad__glyph { width: 34px; height: 34px; font-size: 19px; }
  .pad__code { font-size: 10px; }
  .group__tools input[type="range"] { width: 96px; }
}
/* iPad landscape and desktop: the rack on the left, the pads on the right, each scrolling by itself */
@media (min-width: 900px) and (min-aspect-ratio: 21/20) {
  html, body { height: 100%; overflow: hidden; }
  .desk { height: 100dvh; grid-template-columns: 372px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 12px 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .top { grid-column: 1 / -1; }
  .card--meter { grid-column: 1; grid-row: 2; position: static; box-shadow: inset 0 0 0 1px var(--edge), 0 3px 0 color-mix(in srgb, var(--edge) 45%, #000); }
  .rack { grid-column: 1; grid-row: 3; grid-template-columns: minmax(0, 1fr); }
  .pads { grid-column: 2; grid-row: 2 / 4; }
  .rack, .pads { overflow-y: auto; overscroll-behavior: contain; padding: 0 2px 8px 0; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
  .card--meter .meterwrap { display: block; }
  .card--meter .readout { margin-top: 10px; }
  .card--meter .scope { height: 52px; }
}

/* ---- the measuring bench (?measure=1) -------------------------------------------------------------------------------- */
.bench { display: flex; flex-direction: column; gap: 12px; min-width: 0; grid-column: 1 / -1; }
.bench .card { flex: none; overflow-x: auto; }
.bench .card > h2 { flex-wrap: wrap; }
.bench .card > h2 small { flex-basis: 100%; line-height: 1.4; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-weight: 700; }
.verdict .stamp {
  padding: 6px 14px; border-radius: 10px; font: 700 20px/1.2 var(--font-kai); letter-spacing: .1em;
  color: var(--red-glyph); background: var(--shu); box-shadow: inset 0 0 0 2px var(--red-rim);
}
.verdict[data-ok="0"] .stamp { background: var(--danger); color: var(--danger-ink); box-shadow: none; }
.verdict[data-ok="run"] .stamp { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--edge); }
.verdict p { margin: 0; font-weight: 400; font-size: 13px; color: var(--ink-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.35; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--edge); }
th { font-weight: 600; font-size: 12px; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; }
table.code td:first-child { font: 600 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
td.ok { color: var(--calm); font-weight: 700; }
td.bad { color: var(--danger); font-weight: 700; }
td.dim { color: var(--ink-2); }
@media (min-width: 900px) and (min-aspect-ratio: 21/20) { .bench { grid-row: 2 / 4; overflow-y: auto; padding: 0 2px 8px 0; } }
</style>
</head>
<body>
<div class="desk" id="desk">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">乐</div>
      <div>
        <h1>军乐台</h1>
        <p>audio.js · speech.js 试音</p>
      </div>
    </div>
    <div class="seg" id="theme" role="group" aria-label="主题">
      <button type="button" data-theme-id="chibi" aria-pressed="true">赤壁</button>
      <button type="button" data-theme-id="longzhong" aria-pressed="false">隆中</button>
      <button type="button" data-theme-id="shachang" aria-pressed="false">沙场</button>
    </div>
    <div class="seg" id="motion" role="group" aria-label="动态效果">
      <button type="button" data-motion-id="full" aria-pressed="false">动效</button>
      <button type="button" data-motion-id="reduced" aria-pressed="true">精简</button>
    </div>
    <span class="pill" id="state" data-state="locked" role="status"><i></i><span>未解锁</span></span>
    <button type="button" class="btn" id="mute" aria-pressed="false">静音</button>
  </header>
</div>

<script type="module">
import { createAudio, RECIPE_SOURCES, PRERENDERED, bedVoices } from '../src/ui/audio.js';
import { createSpeech } from '../src/ui/speech.js';

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
/** Builds an element. */
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('data-') || key.startsWith('aria-') || key === 'role' || key === 'for' || key === 'type' || key === 'min' || key === 'max' || key === 'step' || key === 'value' || key === 'id' || key === 'href' || key === 'colspan') node.setAttribute(key, String(value));
    else node[key] = value;
  }
  for (const child of children.flat()) if (child != null) node.append(child);
  return node;
}

const desk = $('#desk');
const root = document.documentElement;
const THEMES = ['chibi', 'longzhong', 'shachang'];
const THEME_NAME = { chibi: '赤壁', longzhong: '隆中', shachang: '沙场' };
const query = new URLSearchParams(location.search);

// ---- theme and motion (shared by both modes) --------------------------------------------------------------------------
const themeListeners = [];
function setTheme(id) {
  root.dataset.theme = id;
  for (const b of $$('#theme button')) b.setAttribute('aria-pressed', String(b.dataset.themeId === id));
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--page').trim());
  for (const cb of themeListeners) cb(id);
}
function setMotion(id) {
  root.dataset.motion = id;
  for (const b of $$('#motion button')) b.setAttribute('aria-pressed', String(b.dataset.motionId === id));
}
$('#theme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.themeId); });
$('#motion').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMotion(b.dataset.motionId); });
setMotion(query.get('motion') === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full');
if (THEMES.includes(query.get('theme'))) setTheme(query.get('theme'));

const dB = x => (x > 0 ? 20 * Math.log10(x) : -Infinity);
const fmtDb = x => (Number.isFinite(x) ? x.toFixed(1) : '−∞').replace('-', '−');

if (query.has('measure')) runBench(); else runDesk();

// =======================================================================================================================
// The sound desk
// =======================================================================================================================

function runDesk() {
  // ---- a tap on the real Web Audio API: counts contexts and live sources, and meters the output --------------------
  // audio.js is used exactly as the game uses it; the page only listens in from outside.
  const probe = {
    contexts: 0, ctorMs: 0, ctx: null, split: null, left: null, right: null,
    bufL: new Float32Array(2048), bufR: new Float32Array(2048),
    tag: 'music', sources: new Map(), maxSfx: 0, maxMusic: 0, peakDb: -Infinity, maxDb: -Infinity,
  };
  const NativeContext = window.AudioContext || window.webkitAudioContext;
  if (NativeContext) {
    const nativeConnect = AudioNode.prototype.connect;
    class TapContext extends NativeContext {
      constructor(...args) {
        const t = performance.now();
        super(...args);
        probe.ctorMs = performance.now() - t;             // the browser's own share of the first tap
        probe.contexts++;
        probe.ctx = this;
        probe.sources.clear();
        probe.split = this.createChannelSplitter(2);
        probe.left = this.createAnalyser();
        probe.right = this.createAnalyser();
        probe.left.fftSize = probe.right.fftSize = 2048;
        nativeConnect.call(probe.split, probe.left, 0);
        nativeConnect.call(probe.split, probe.right, 1);
      }
    }
    window.AudioContext = TapContext;
    if (window.webkitAudioContext) window.webkitAudioContext = TapContext;
    // whatever feeds the destination also feeds the meter
    AudioNode.prototype.connect = function (...args) {
      const result = nativeConnect.apply(this, args);
      if (probe.ctx && args[0] === probe.ctx.destination && probe.split) nativeConnect.call(this, probe.split);
      return result;
    };
    const track = proto => {
      const nativeStart = proto.start;
      proto.start = function (...args) {
        if (this.context === probe.ctx) {
          const rec = { s: typeof args[0] === 'number' ? args[0] : this.context.currentTime, e: Infinity, tag: probe.tag };
          probe.sources.set(this, rec);
          this.addEventListener('ended', () => probe.sources.delete(this), { once: true });
        }
        return nativeStart.apply(this, args);
      };
    };
    track(AudioScheduledSourceNode.prototype);
    if (Object.hasOwn(AudioBufferSourceNode.prototype, 'start')) track(AudioBufferSourceNode.prototype);
    const nativeStop = AudioScheduledSourceNode.prototype.stop;
    AudioScheduledSourceNode.prototype.stop = function (...args) {
      const rec = probe.sources.get(this);
      if (rec) rec.e = typeof args[0] === 'number' ? args[0] : this.context.currentTime;
      return nativeStop.apply(this, args);
    };
  }
  /** Source nodes alive right now, by kind. */
  function liveSources() {
    const out = { sfx: 0, music: 0 };
    if (!probe.ctx) return out;
    const now = probe.ctx.currentTime;
    for (const [node, rec] of probe.sources) {
      if (rec.e < now - 1) probe.sources.delete(node);
      else if (rec.s <= now && now < rec.e) out[rec.tag]++;
    }
    probe.maxSfx = Math.max(probe.maxSfx, out.sfx);
    probe.maxMusic = Math.max(probe.maxMusic, out.music);
    return out;
  }

  // ---- the engine -----------------------------------------------------------------------------------------------------
  let audio = createAudio();
  let speech = createSpeech({ audio });
  const settings = { sfx: true, music: true, volume: 1 };
  const params = { ms: 300, when: 0, gain: 1, step: 0 };
  let musicOn = false;
  let tension = 0.15;

  // like the stage: every gesture unlocks (cheap when already running)
  /**
   * The gesture that created the context of this engine: when it came, how long unlock() kept its handler, and how much
   * of that was the browser building the AudioContext (M-121 bounds what is left: about 25 ms).
   */
  let firstTouch = null;
  const unlockNow = () => {
    const contexts = probe.contexts;
    const at = performance.now();
    audio.unlock().then(refreshState);
    if (probe.contexts > contexts) firstTouch = { at, ms: performance.now() - at, ctor: probe.ctorMs };
  };
  window.addEventListener('pointerdown', unlockNow, true);
  window.addEventListener('keydown', unlockNow, true);

  /**
   * Resolves as soon as the engine is unlocked. It does not wait for the stingers to be rendered, which is what the
   * promise of unlock() does: the sound of the first tap is due when the context runs, a stinger live (M-121).
   */
  const unlockedSoon = () => new Promise(resolve => {
    const done = () => { window.removeEventListener('audio:unlocked', done); resolve(); };
    window.addEventListener('audio:unlocked', done);
    audio.unlock().then(done);
  });

  /** Plays an effect from a pad: on the very first tap it waits for the unlock that the same tap started. */
  async function hit(name, opts) {
    if (!audio.unlocked) await unlockedSoon();
    const o = { ...opts };
    if (params.when > 0 && o.when === undefined) o.when = params.when;
    if (params.gain !== 1) o.gain = params.gain;
    probe.tag = 'sfx';
    try { audio.play(name, o); } finally { probe.tag = 'music'; }
    const shown = Object.entries(o).map(([k, v]) => `${k}: ${typeof v === 'number' ? +v.toFixed(2) : v}`).join(', ');
    lastEl.replaceChildren('刚才 ', el('b', { text: name }), shown ? ` { ${shown} }` : '');
  }

  // ---- markup ---------------------------------------------------------------------------------------------------------
  const sw = (id, label, hint, pressed = false) => el('button', { type: 'button', class: 'sw', id, 'aria-pressed': String(pressed) },

  const toggle = (button, fn) => button.addEventListener('click', () => {

    [['game', '对局'], ['victory', '大捷'], ['defeat', '惜败']].map(([id, label], i) => el('button', { type: 'button', 'data-scene': id, 'aria-pressed': String(i === 0), text: label })));
  const paletteSeg = el('div', { class: 'seg seg--wide', id: 'palette', role: 'group', 'aria-label': '音色' },
    THEMES.map((id, i) => el('button', { type: 'button', 'data-palette': id, 'aria-pressed': String(i === 0), text: THEME_NAME[id] })));
  const musicCard = el('section', { class: 'card' },
    el('h2', {}, '行军乐', el('small', { text: '随局势起伏的琴、鼓、号' })),
    el('div', { class: 'row' }, musicBtn, el('button', { type: 'button', class: 'btn', id: 'musicFade', text: '渐收 2 秒' })),

  // switches card
  const volumeInput = range('volume', 0, 1, 0.01, 1);
  const volumeInfo = el('b', { text: '100%' });
  const switchCard = el('section', { class: 'card' },
    el('h2', {}, '总开关', el('small', { text: 'applySettings · setMuted · setHidden' })),

      el('button', { type: 'button', class: 'btn', id: 'book', text: '预约六响' }),

  // speech card
  const speakDot = el('span', { class: 'pill', id: 'speaking', 'data-state': 'locked' }, el('i'), el('span', { text: '安静' }));
  const speechCard = el('section', { class: 'card' },
    el('h2', {}, '军师朗读', el('small', { text: speech.supported ? 'speechSynthesis · 默认关闭' : '此浏览器不支持朗读' })),
    sw('readAloud', '朗读', '第一位 zh-CN 嗓音 · 语速 1.05'),
    el('div', { class: 'row' },
      el('button', { type: 'button', class: 'btn', id: 'say1', text: '念一句' }),
      el('button', { type: 'button', class: 'btn', id: 'say3', text: '念三句' }),
      el('button', { type: 'button', class: 'btn', id: 'hush', text: '打断' }),
      speakDot));

  // log card
  const logEl = el('ul', { class: 'log', id: 'log' });
  const logCard = el('section', { class: 'card' }, el('h2', {}, '动静', el('small', { text: 'window 事件 audio:unlocked · audio:state' })), logEl,
    el('p', { class: 'note' }, el('a', { href: '?measure=1', class: 'btn', style: 'display:inline-flex;align-items:center;text-decoration:none' }, '去测量台 →')));

  // pads

      ['chat.send', '问', '发问'], ['chat.receive', '答', '军师开口'], ['chat.tick', '字', '打字声 ×12', { burst: 12 }]] },
    { title: '选子与试走', hint: '试走是悬着的音程，落子才回到主音', pads: [
      ['select', '选', '选子'], ['deselect', '放', '放下'], ['illegal', '禁', '不能走'], ['place', '啪', '落子'],
      ['trial.lift', '试', '提子试走', { step: true }], ['trial.retract', '回', '换一步'], ['trial.confirm', '定', '确定落子']] },
    { title: '行棋', hint: '子越重，声越沉', tool: 'ms', pads: [
      ['move.rook', '车', '车 · 冲锋', { ms: true, warm: true }], ['move.horse', '马', '马 · 腾跃', { ms: true, warm: true }], ['move.cannon', '炮', '炮 · 滚动', { ms: true, warm: true }],
      ['move.elephant', '相', '相 · 踏步', { ms: true, warm: true }], ['move.advisor', '仕', '仕 · 闪身', { ms: true, warm: true }], ['move.king', '帅', '帅 · 稳步', { ms: true, warm: true }],
      ['move.pawn', '兵', '兵 · 小跳', { ms: true, warm: true }], ['river', '河', '渡河']] },
    { title: '吃子', hint: 'capture 的 scale = 被吃的子有多大', pads: [
      ['capture', '卒', '吃卒 ×0.6', { opts: { scale: 0.6 } }], ['capture', '马', '吃马 ×1.0', { opts: { scale: 1 } }],
      ['capture', '车', '吃车 ×1.25', { opts: { scale: 1.25 } }], ['capture', '将', '擒王 ×1.4', { opts: { scale: 1.4 } }],
      ['cannon.fire', '火', '点火'], ['blast', '轰', '炮响']] },
    { title: '将军与终局', hint: '锣、鼓、筝', pads: [
      ['check.give', '将', '将军！', { warm: true }], ['check.take', '危', '被将军'], ['check.soft', '轻', '连将（轻）'],
      ['win', '胜', '绝杀', { warm: true }], ['lose', '负', '惜败'], ['draw', '和', '握手言和'], ['deal', '摆', '摆棋开局', { warm: true }], ['undo', '悔', '悔棋']] },
    { title: '锦囊与军师', hint: '提示与夸奖', pads: [
      ['hint.1', '一', '锦囊一'], ['hint.2', '二', '锦囊二'], ['hint.3', '三', '锦囊三'], ['fan.sweep', '扇', '羽扇一挥'],
      ['stamp', '印', '招式印', { warm: true }], ['praise.good', '好', '好棋'], ['praise.great', '妙', '妙手'], ['praise.brilliant', '绝', '神来之笔', { warm: true }],
      ['warn', '嗯', '且慢……'], ['arrow', '箭', '箭头'], ['turn.yours', '请', '该你了']] },

    ['炮击将军', '最响的一刻：炮、落子、将军叠在一起', () => { hit('cannon.fire'); hit('blast', { when: 0.2 }); hit('place', { when: 0.2 }); hit('check.give', { when: 0.25 }); }],

  const msInput = range('ms', 120, 600, 10, params.ms);
  const msInfo = el('b', { text: '300 ms' });
  const whenInput = range('when', 0, 1, 0.05, 0);
  const whenInfo = el('b', { text: '立刻' });
  const gainInput = range('gain', 0.2, 1.5, 0.05, 1);
  const gainInfo = el('b', { text: '×1.00' });

  const padEl = ([name, glyph, label, extra = {}]) => {
    const pre = PRERENDERED.includes(name);
    const button = el('button', { type: 'button', class: `pad${extra.warm ? ' pad--warm' : ''}`, 'data-sfx': name, title: name },
      el('span', { class: 'pad__glyph', text: glyph }),
      el('span', {},
        el('span', { class: 'pad__name', text: label }),
        el('span', { class: 'pad__code' }, name, pre ? el('em', { text: '预制' }) : null, el('span', { text: `${RECIPE_SOURCES[name]} 源` }))));
    button.addEventListener('click', () => {
      flash(button);
      if (extra.burst) {

  desk.append(meterCard, rack, pads);

  // ---- wiring ---------------------------------------------------------------------------------------------------------
  const stateEl = $('#state');

  let lastState = 'locked';

  const log = (text, ...more) => {

  };
  window.addEventListener('audio:unlocked', () => {
    lastState = 'running';
    log('audio:unlocked');
    refreshState();
    // What the first tap cost, to be read on the device itself (CONTRACT-NOTES M-121). unlock() resolves when the six
    // stingers are rendered. It is asked in a microtask: this event can fire inside the unlock() of the gesture, before
    // that call has returned and before the engine has started the renders.
    const engine = audio;
    Promise.resolve().then(() => {
      const touch = firstTouch;
      firstTouch = null;
      if (touch) engine.unlock().then(ok => {
        if (ok && engine === audio) log(`首次触碰  unlock() ${touch.ms.toFixed(1)} 毫秒 · `,
          el('span', { style: 'white-space:nowrap', text: `其中建上下文 ${touch.ctor.toFixed(1)} · 预制音效 ${Math.round(performance.now() - touch.at)} 毫秒后就绪` }));

    //   to 4 dB quieter than it ever will in a game. Good for comparing with the contract, not for "does it clip".
    // "In play": the sound starts one second in, the compressor settled, as in a game. The level of a short sound
    //   also depends on where in a 128-frame render quantum it starts (a dB or two), so two starting points are
    //   tried, in all three palettes, and the loudest counts.
    // The engine starts a sound a few milliseconds after it is asked to; `lead` takes that out.
    const trial = await render({ seconds: 0.3, job: audio => audio.play('ui.tap', { when: 0.05 }) });
    const lead = trial.firstStart - 0.05;
    result.lead = lead;
    result.prerenderMs = Math.round(trial.unlockMs);
    const COLD = 0.05;
    const WARM = [1.0, 1.0037];

    // ---- 1. every effect --------------------------------------------------------------------------------------------
    const rows = [];
    for (const name of Object.keys(RECIPE_SOURCES)) {
      const opts = TRAVEL[name] ? { ms: TRAVEL[name] } : {};
      rows.push({ label: name, plays: [[name, opts]] });
      if (name === 'capture') for (const scale of [0.6, 1.25, 1.4]) rows.push({ label: `capture ×${scale}`, plays: [['capture', { scale }]] });
      if (name === 'blast') rows.push({ label: 'cannon.fire + blast @200ms', plays: [['cannon.fire', {}], ['blast', { when: 0.2 }]] });
    }
    for (const row of rows) {
      const run = async (palette, start) => {
        const out = await render({ seconds: start + 4.2, palette, job: audio => { for (const [name, opts] of row.plays) audio.play(name, { ...opts, when: start - lead + (opts.when ?? 0) }); } });
        return { ...stats(out.buffer), created: out.created };
      };
      const m = await run('chibi', COLD);
      const per = { cold: m, chibi: await run('chibi', WARM[0]), chibiLate: await run('chibi', WARM[1]), longzhong: await run('longzhong', WARM[0]), shachang: await run('shachang', WARM[0]) };
      const worst = Math.max(per.chibi.peak, per.chibiLate.peak, per.longzhong.peak, per.shachang.peak);
      const [cPeak, cMs] = CONTRACT[row.label] ?? [null, null];
      const single = row.plays.length === 1 ? row.plays[0][0] : null;
      const expectSources = single ? (PRERENDERED.includes(single) ? 1 : RECIPE_SOURCES[single]) : null;
      const silent = Object.values(per).some(x => !(x.ms > 0) || !Number.isFinite(x.peak));
      const clips = !(Math.max(worst, m.peak) < 0);
      const wrongCount = expectSources !== null && m.created !== expectSources;
      const dPeak = cPeak == null ? null : m.peak - cPeak;
      const dMs = cMs == null ? null : m.ms - cMs;
      if (silent) problem(`${row.label}: silent`);
      if (clips) problem(`${row.label}: peak at or above 0 dBFS`);
      if (!(worst < LIMIT_KNEE_DB)) problem(`${row.label}: peaks at ${num(worst)} dBFS in play, inside the knee of the limiter`);
      if (wrongCount) problem(`${row.label}: ${m.created} sources created, RECIPE_SOURCES says ${expectSources}`);
      const farPeak = dPeak != null && Math.abs(dPeak) > 1;
      const farMs = dMs != null && Math.abs(dMs) > Math.max(15, 0.05 * cMs);
      const note = [];
      if (ESTIMATES.includes(row.label)) note.push('契约为估值');
      else if (farPeak || farMs) note.push('有别');
      const ok = !silent && !clips && !wrongCount;
      sfxBody.append(el('tr', {},
        td(row.label), td(String(m.created) + (single && PRERENDERED.includes(single) ? `（预制 ${RECIPE_SOURCES[single]}）` : '')),
        td(num(m.peak)), td(num(cPeak), 'dim'), td(signed(dPeak), farPeak ? 'bad' : 'dim'),
        td(String(m.ms)), td(cMs == null ? '—' : String(cMs), 'dim'), td(dMs == null ? '—' : (dMs >= 0 ? '+' : '−') + Math.abs(dMs), farMs ? 'bad' : 'dim'),
        td(num(worst)),
        td(ok ? (note.length ? `✓ ${note.join(' · ')}` : '✓') : '✗', ok ? 'ok' : 'bad')));
      result.sfx.push({ name: row.label, sources: m.created, peak: m.peak, ms: m.ms, contractPeak: cPeak, contractMs: cMs, worst,
        chibi: per.chibi.peak, chibiLate: per.chibiLate.peak, longzhong: per.longzhong.peak, shachang: per.shachang.peak,
        msInPlay: per.chibi.ms, msLongzhong: per.longzhong.ms, msShachang: per.shachang.ms });
      await breathe();
    }

    // ---- 2. the music bed -------------------------------------------------------------------------------------------
    const beds = [
      ...BED_TENSIONS.map(T => ({ label: `T = ${T}`, T, bpm: 66 + 30 * T, scene: 'game' })),
      { label: '大捷 victory', T: 0.4, bpm: 88, scene: 'victory' },
      { label: '惜败 defeat', T: 0.05, bpm: 60, scene: 'defeat' },
    ];
    for (const bed of beds) {
      const bars = 4 * 16 * (60 / bed.bpm / 4);
      const per = {};
      for (const palette of THEMES) {
        const out = await render({
          seconds: bars + 1.6, palette, stepped: true,
          job: audio => { audio.setTension(bed.T); audio.music.setScene(bed.scene); audio.music.start(); },
        });
        // the piece begins 60 ms after start(); the window is exactly four bars
        per[palette] = { ...stats(out.buffer, 0.06, 0.06 + bars), live: out.live };
      }
      const m = per.chibi;
      const like = m.rms + 10 * Math.log10(bars / 16);        // the same energy spread over the prototype's 16 s buffer
      const contract = bed.scene === 'game' ? bedFigure(bed.T) : null;
      const stated = BED_FIGURES.some(([T]) => T === bed.T);
      const over = THEMES.some(p => per[p].live > 20);
      const clips = THEMES.some(p => !(per[p].peak < 0));
      const quiet = THEMES.some(p => !Number.isFinite(per[p].rms) || per[p].rms < -40);
      if (over) problem(`bed ${bed.label}: more than 20 sources at once`);
      if (clips) problem(`bed ${bed.label}: clips`);
      if (quiet) problem(`bed ${bed.label}: silent`);
      const d = contract == null ? null : like - contract;
      const loud = d != null && Math.abs(d) > BED_TOLERANCE;
      if (loud) problem(`bed ${bed.label}: ${signed(d)} dB from the loudness of §10.5.5`);
      const ok = !over && !clips && !quiet && !loud;
      bedBody.append(el('tr', {},
        td(bed.label), td(num(bed.bpm)), td(num(m.rms)), td(num(like)), td(contract == null ? '—' : num(contract) + (stated ? '' : ' 插值'), 'dim'), td(signed(d), loud ? 'bad' : 'dim'),
        td(num(m.peak)), td(bed.scene === 'game' ? `${m.live}（表算 ${bedVoices(bed.T)}）` : String(m.live)),
        td(num(per.longzhong.rms)), td(num(per.shachang.rms)),
        td(ok ? '✓' : loud ? '✗ 与契约差得多' : '✗', ok ? 'ok' : 'bad')));
      result.bed.push({ label: bed.label, T: bed.T, bpm: bed.bpm, scene: bed.scene, rms: m.rms, rmsLikeContract: like, peak: m.peak, live: m.live, model: bed.scene === 'game' ? bedVoices(bed.T) : null,
        contract, stated, longzhong: per.longzhong.rms, shachang: per.shachang.rms, peakLongzhong: per.longzhong.peak, peakShachang: per.shachang.peak, liveLongzhong: per.longzhong.live, liveShachang: per.shachang.live });
      await breathe();
    }

    // ---- 3. the worst cases -----------------------------------------------------------------------------------------
    const stack = (audio, list, at) => { for (const [name, opts] of list) audio.play(name, { ...opts, when: at - lead + (opts.when ?? 0) }); };
    // the twelve loudest rows of the table above
    const LOUDEST = [['win', {}], ['capture', { scale: 1.4 }], ['blast', {}], ['trial.confirm', {}], ['stamp', {}], ['check.give', {}], ['deal', {}],
      ['move.king', { ms: 0 }], ['check.take', {}], ['move.elephant', { ms: 0 }], ['draw', {}], ['move.rook', { ms: 0 }]];
    const mixes = [
      { label: '音乐 T=.95 + 炮击 + 将军 + 落子', contract: -2.0,
        job: (audio, shift) => { audio.setTension(0.95); audio.music.start(); stack(audio, [['cannon.fire', {}], ['blast', { when: 0.2 }], ['place', { when: 0.2 }], ['check.give', { when: 0.25 }]], 1.05 + shift); } },
      { label: '音乐 T=.95 + win', contract: -2.6,
        job: (audio, shift) => { audio.setTension(0.95); audio.music.start(); stack(audio, [['win', {}]], 0.55 + shift); } },
      // what the choreography of §10.3 can really pile up, over the bed at full tension
      { label: '音乐 T=1 + 车吃车（吃子、40 毫秒后落子与确定、再将军）', contract: null,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, [['capture', { scale: 1.25 }], ['move.rook', { ms: 40 }], ['trial.confirm', { when: 0.04 }], ['check.give', { when: 0.22 }]], 1.05 + shift); } },
      { label: '音乐 T=1 + 炮击绝杀（点火、炮响、确定、win）', contract: null,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, [['cannon.fire', {}], ['blast', { when: 0.2 }], ['trial.confirm', { when: 0.56 }], ['win', { when: 0.7 }]], 1.05 + shift); } },
      { label: '音乐 T=.7 + 妙手成招（确定、招式印、神来之笔）', contract: null,
        job: (audio, shift) => { audio.setTension(0.7); audio.music.start(); stack(audio, [['trial.confirm', {}], ['stamp', { when: 0.2 }], ['praise.brilliant', { when: 0.2 }]], 1.05 + shift); } },
      // What no choreography does, to prove the soft limiter: before it existed the first of these peaked at +0.6 dBFS.
      { label: '极端：音乐 T=1 + win + 擒王 + 帅落地 + 炮响 + 确定（同一瞬）', contract: null, extreme: true,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, [['win', {}], ['capture', { scale: 1.4 }], ['move.king', { ms: 0 }], ['blast', {}], ['trial.confirm', {}]], 1.05 + shift); } },
      { label: '极端：同上五声，力度 gain 2（play 所许的最大）', contract: null, extreme: true,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, [['win', { gain: 2 }], ['capture', { scale: 1.4, gain: 2 }], ['move.king', { ms: 0, gain: 2 }], ['blast', { gain: 2 }], ['trial.confirm', { gain: 2 }]], 1.05 + shift); } },
      { label: '极端：十二个最响的音同一瞬，力度 gain 2', contract: null, extreme: true,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, LOUDEST.map(([name, opts]) => [name, { ...opts, gain: 2 }]), 1.05 + shift); } },
      { label: '极端：四十三种音效同一瞬（声源封顶 48）', contract: null, extreme: true,
        job: (audio, shift) => { audio.setTension(1); audio.music.start(); stack(audio, Object.keys(RECIPE_SOURCES).map(name => [name, {}]), 1.05 + shift); } },
    ];
    for (const mix of mixes) {
      const per = {};
      for (const palette of THEMES) {
        let peak = -Infinity;
        for (const shift of [0, 0.0037]) {
          const out = await render({ seconds: 5.5, palette, stepped: true, job: audio => mix.job(audio, shift) });
          peak = Math.max(peak, stats(out.buffer).peak);
        }
        per[palette] = peak;
      }
      const clips = THEMES.some(p => !(per[p] < 0));
      if (clips) problem(`mix "${mix.label}": peak at or above 0 dBFS`);
      mixBody.append(el('tr', {}, td(mix.label), td(num(per.chibi, 2)), td(num(per.longzhong, 2)), td(num(per.shachang, 2)), td(num(mix.contract), 'dim'),
        td(clips ? '✗' : mix.extreme ? '✓ 软限幅收住' : '✓ 不削波', clips ? 'bad' : 'ok')));
      result.mix.push({ label: mix.label, chibi: per.chibi, longzhong: per.longzhong, shachang: per.shachang, contract: mix.contract, extreme: !!mix.extreme });
      await breathe();
    }

    const ok = result.problems.length === 0;
    verdict.dataset.ok = ok ? '1' : '0';
    verdict.firstElementChild.textContent = ok ? '合格' : '不合格';
    verdict.lastElementChild.textContent = ok
      ? `${result.sfx.length} 行音效都有声、都不削波（对局中最响 ${num(Math.max(...result.sfx.map(s => s.worst)))} dBFS）；行军乐同时在响的声源至多 ${Math.max(...result.bed.flatMap(b => [b.live, b.liveLongzhong, b.liveShachang]))} 个；对局里最坏的混合峰值 ${num(Math.max(...result.mix.filter(m => !m.extreme).flatMap(m => [m.chibi, m.longzhong, m.shachang])))} dBFS，硬叠出来的极端也只到 ${num(Math.max(...result.mix.filter(m => m.extreme).flatMap(m => [m.chibi, m.longzhong, m.shachang])), 2)} dBFS；行军乐各张力与契约相差至多 ${num(Math.max(...result.bed.filter(b => b.contract != null).map(b => Math.abs(b.rmsLikeContract - b.contract))), 2)} dB。六个长音预制一次约 ${result.prerenderMs} 毫秒。`
      : result.problems.join('； ');
    result.ok = ok;
  } catch (error) {
    verdict.dataset.ok = '0';
    verdict.firstElementChild.textContent = '出错';
    verdict.lastElementChild.textContent = String(error && error.stack ? error.stack : error);
    result.ok = false;
    result.error = String(error && error.stack ? error.stack : error);
  } finally {
    Math.random = realRandom;
    window.AudioContext = NativeContext;
    window.setTimeout = realTimeout;
    window.clearTimeout = realClear;
  }
  window.__measure = result;
}
</script>
</body>
</html>
