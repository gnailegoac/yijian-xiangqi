<!doctype html>
<html lang="zh-CN" data-theme="chibi" data-motion="full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1d">
<title>弈间 · 界面试验台 (hud.js)</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="../styles/layout.css">
<link rel="stylesheet" href="../styles/buddy.css">
<link rel="stylesheet" href="../styles/rival.css">
<link rel="stylesheet" href="../styles/hud.css">
<style>
/* Dev harness for src/ui/hud.js (package X7). Not part of the game: never built into dist/.
 * The page is the real shell of index.html (same regions, same layout.js), with the hud as the only module.
 * The board and the coach column show the shell's placeholders. The control panel sits where the board is,
 * inside #stage, so every overlay covers it exactly as it would cover the board.
 *
 * URL: ?theme=chibi|longzhong|shachang  ?motion=full|reduced  ?panel=0 (hide the controls)
 *      ?figure=<mood> (the real 诸葛亮 in the coach column instead of the placeholder, e.g. cheering)
 * Scripted use: window.__dev = { hud, set(phase, extra), start(kind), over(kind), sheet(kind), coachFigure(mood), sample, … }. */

.dev {
  position: absolute; inset: 10px calc(10px + var(--_stage-room, 0px)); z-index: 2;      /* over the board, not over the room layout.css gives #stage beside it in landscape */
  display: flex; flex-direction: column; gap: 6px; padding: 8px;
  border: 1px dashed var(--edge); border-radius: 14px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink);
  font: 500 12px/1.3 var(--font-ui); overflow: auto; overscroll-behavior: contain;
}
.dev[hidden] { display: none; }
.dev h2 { margin: 0; font: 700 14px/1.2 var(--font-ui); display: flex; align-items: center; gap: 8px; }
.dev h2 small { font-weight: 500; color: var(--ink-2); }
.dev fieldset { margin: 0; padding: 4px 6px 6px; border: 1px solid var(--edge); border-radius: 10px; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.dev legend { padding: 0 4px; color: var(--ink-2); font-weight: 700; }
.dev button, .dev select {
  min-height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--edge);
  background: var(--surface-2); color: var(--ink); font: 600 12px/1 var(--font-ui); cursor: pointer;
}
.dev button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.dev label { display: inline-flex; align-items: center; gap: 4px; }
.dev__log { flex: 1 1 60px; min-height: 60px; margin: 0; padding: 6px 8px; border-radius: 10px; background: var(--page); color: var(--ink-2);
  font: 500 11px/1.5 ui-monospace, Consolas, monospace; overflow: auto; white-space: pre-wrap; }
#app[data-layout="compact"] .dev { inset: 4px; padding: 6px; }

/* stand-in for the rival's plate while rival-view.js draws nothing */
.dev-rival { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dev-rival i { flex: none; width: calc(var(--top) - 8px); height: calc(var(--top) - 8px); border-radius: 50%; border: 2px solid var(--edge);
  background: radial-gradient(circle at 40% 35%, var(--blk-a), var(--blk-c)); }
.dev-rival b { display: block; font: 600 15px/18px var(--font-ui); white-space: nowrap; }
.dev-rival small { display: block; font: 400 12px/14px var(--font-ui); color: var(--ink-2); white-space: nowrap; }
#app[data-layout="compact"] .dev-rival small { display: none; }
</style>
</head>
<body>
<div id="app" class="app" data-layout="landscape" data-phase="boot" data-ply="0" data-kb="0" data-sheet="0" data-coach="local">
  <header id="topbar" class="topbar"></header>
  <main id="stage" class="stage"><div id="board"></div>
    <aside class="dev" id="dev" aria-label="hud 试验台">
      <h2>hud.js <small id="dev-size"></small></h2>
      <fieldset><legend>主题 / 动态</legend>
        <button data-theme-id="chibi">赤壁</button><button data-theme-id="longzhong">隆中</button><button data-theme-id="shachang">沙场</button>
        <button data-motion-id="full">full</button><button data-motion-id="reduced">reduced</button>
      </fieldset>
      <fieldset><legend>setPhase</legend>
        <button data-phase-id="boot">boot</button><button data-phase-id="childTurn">childTurn</button><button data-phase-id="selected">selected</button>
        <button data-phase-id="tentative">tentative</button><button data-phase-id="opponentTurn">opponentTurn</button>
        <button data-phase-id="failed">opp + failed</button><button data-phase-id="over">over</button>
        <label><input type="checkbox" id="dev-undo" checked> canUndo</label>
        <label>hintLevel <select id="dev-level"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
        <button data-do="nudge">nudgeHint</button><button data-do="beacon">beaconConfirm</button>
      </fieldset>
      <fieldset><legend>顶栏</legend>
        <button data-do="round1">setRound 1</button><button data-do="round+">+1</button><button data-do="round37">37</button>
        <button data-do="trophy0">trophies 0</button><button data-do="trophy3">3 / 1</button><button data-do="trophy9">9 / 7</button><button data-do="trophy+">+1</button>
        <button data-do="mute">setMuted toggle</button>
        <button data-do="rival-say">司马懿说话</button><button data-do="rival-think">司马懿思考</button><button data-do="rival-calm">司马懿平静</button>
      </fieldset>
      <fieldset><legend>setNotation</legend>
        <button data-do="rows0">空</button><button data-do="rows3">3 步</button><button data-do="rows41">41 步</button>
      </fieldset>
      <fieldset><legend>showStart</legend>
        <button data-start="first">首次</button><button data-start="first-import">首次 + 导入</button>
        <button data-start="resume">有存档</button><button data-start="again">无存档</button>
      </fieldset>
      <fieldset><legend>showOver</legend>
        <button data-over="win">胜 · 绝杀</button><button data-over="stalemate">胜 · 困毙</button><button data-over="loss">负</button>
        <button data-over="draw">和</button><button data-over="plain">负 · 无附加</button><button data-over="quiet">quiet</button>
        <button data-do="over-close">close()</button>
        <label>军师栏 <select id="dev-figure"><option value="">占位</option></select></label>
      </fieldset>
      <fieldset><legend>菜单与抽屉</legend>
        <button data-do="menu">≡ 菜单</button><button data-sheet="settings">设置</button><button data-sheet="notation">棋谱</button>
        <button data-sheet="rules">规则速查</button><button data-sheet="about">关于弈间</button>
      </fieldset>
      <fieldset><legend>openSettings(status)</legend>
        <label>军师 <select id="dev-coach">
          <option value="llm">llm</option><option value="local:">local (no reason)</option><option value="local:no_proxy">no_proxy</option>
          <option value="local:no_key">no_key</option><option value="local:origin">origin</option><option value="local:unreachable">unreachable</option>
          <option value="local:setting">setting</option><option value="local:paused">paused</option><option value="local:version">version</option>
        </select></label>
        <label>境界 <select id="dev-rank"><option value="">(无)</option><option>初出茅庐</option><option>初露锋芒</option><option>天下无双</option></select></label>
      </fieldset>
      <fieldset><legend>对话框 / 提示</legend>
        <button data-do="resign">confirm('resign')</button><button data-do="newgame">newGameDialog()</button>
        <button data-do="toast">toast</button><button data-do="toast-long">toast (长)</button>
        <button data-do="block">blocking</button><button data-do="closeall">closeAll()</button>
      </fieldset>
      <pre class="dev__log" id="dev-log" aria-live="off"></pre>
    </aside>
  </main>
  <div id="underbar" class="underbar"></div>
  <section id="coach" class="coach" aria-label="军师">
    <div id="buddy" class="coach__buddy"></div>
    <div id="chat" class="coach__chat"></div>
  </section>
  <div id="actions" class="actions"></div>
  <div id="overlays"></div>
</div>

<script type="module">
import { MOODS } from '../src/core/codes.js';
import { computeLayout, applyLayout } from '../src/ui/layout.js';
import { createRivalView } from '../src/ui/rival-view.js';
import { createBuddy } from '../src/ui/buddy.js';
import { createHud } from '../src/ui/hud.js';
import { TXT } from '../src/ui/texts.js';

const $ = (sel) => document.querySelector(sel);
const app = $('#app');
const html = document.documentElement;
const query = new URLSearchParams(location.search);

// ---- log ----
const logEl = $('#dev-log');
const lines = [];
function log(text) {
  lines.push(text);
  if (lines.length > 60) lines.shift();
  logEl.textContent = lines.join('\n');
  logEl.scrollTop = logEl.scrollHeight;
}

// ---- layout: the real one ----
let lastLayout = null, figure = null;              // figure: the coach column's 诸葛亮, see coachFigure()
function layout() {
  const vv = window.visualViewport;
  const result = computeLayout({ W: innerWidth, H: innerHeight, visibleH: vv ? vv.height : innerHeight, sheet: false });
  applyLayout(app, result, vv ?? null);
  lastLayout = result;
  figure?.setVariant(result.buddy);
  $('#dev-size').textContent = `${innerWidth} x ${innerHeight} · ${result.layout}`;
}
addEventListener('resize', layout);
layout();

// ---- the coach column's figure ----
// In the game the stage puts 诸葛亮 (buddy.js) into #buddy; this harness shows the shell's placeholder there until
// asked. With him in place one sees what hud.css does to him: he is transparent while the start overlay is up, and
// in landscape while the game-over card is up (the card covers neither a raised fan nor, in a tall window, his feet).
for (const mood of MOODS) $('#dev-figure').append(new Option(mood));
function coachFigure(mood) {                       // a Mood of §11.3; anything else gives the placeholder back
  if (!MOODS.includes(mood)) { figure?.destroy(); figure = null; }
  else {
    figure ??= createBuddy($('#buddy'), { variant: lastLayout.buddy, reducedMotion: html.dataset.motion !== 'full' });
    figure.setMood(mood, { instant: true });
  }
  $('#dev-figure').value = figure ? figure.getMood() : '';
}

// ---- fakes for the hud's dependencies ----
const played = [];
const audio = {                                    // records what the hud plays; no sound in the harness
  unlocked: true, unlock: async () => true,
  play(name) { played.push(name); log(`audio.play('${name}')`); },
  setTension() {}, music: { start() {}, stop() {}, setScene() {} }, setSuspense() {}, duck() {}, setPalette() {}, setMuted() {},
  applySettings() {}, cancelScheduled() {}, setHidden() {}, dispose() {},
};
const rivalHost = document.createElement('div');   // the stage appends the plate's host to #topbar before createHud
$('#topbar').append(rivalHost);
const rival = createRivalView(rivalHost);
if (!rivalHost.childElementCount) {                // rival-view.js draws nothing yet: a stand-in so the bar is realistic
  rivalHost.className = 'dev-rival';
  const face = document.createElement('i'), text = document.createElement('span');
  const name = document.createElement('b'), title = document.createElement('small');
  name.textContent = '司马懿'; title.textContent = '魏 · 大都督';
  text.append(name, title); rivalHost.append(face, text);
} else {
  rival.set({ mood: 'calm' });
}

const hud = createHud(
  { topbar: $('#topbar'), underbar: $('#underbar'), actions: $('#actions'), overlays: $('#overlays') },
  { audio, rival, support: { tts: 'speechSynthesis' in window, haptics: true } },
);

// ---- sample data ----
const P = (type, color, n = 1) => ({ id: `${color}-${type}-${n}`, type, color });
const sample = {
  mine: [P('pawn', 'black'), P('cannon', 'black'), P('horse', 'black'), P('pawn', 'black', 2), P('rook', 'black'), P('elephant', 'black'),
         P('advisor', 'black'), P('pawn', 'black', 3), P('horse', 'black', 2)],
  lost: [P('pawn', 'red'), P('horse', 'red'), P('cannon', 'red'), P('pawn', 'red', 2), P('elephant', 'red'), P('rook', 'red'), P('pawn', 'red', 3)],
  moves: ['炮二平五', '马8进7', '马二进三', '车9平8', '车一平二', '炮8平9', '车二进六', '马2进3', '兵七进一', '卒7进1',
          '车二平三', '炮9退1', '马八进七', '士4进5', '炮八平九', '炮9平7', '车三平四', '马7进8', '车九平八', '车1平2'],
  takeaway: '大捷！第18回合那步捉双最漂亮。',
  goal: '下一盘小目标——吃子之前，先看它有没有保镖。',
};
function rowsOf(plies) {
  const rows = [];
  for (let i = 0; i < plies; i++) {
    const text = sample.moves[i % sample.moves.length];
    if (i % 2 === 0) rows.push({ n: i / 2 + 1, red: text }); else rows[rows.length - 1].black = text;
  }
  return rows;
}

// ---- a tiny stand-in for the stage and the director ----
const state = { phase: 'boot', canUndo: true, hintLevel: 0, failed: false, round: 1, muted: false, mine: 0, lost: 0, plies: 0 };
let settings = { schema: 2, theme: 'chibi', sfx: true, music: true, volume: 1, motion: 'auto', haptics: true, typeTicks: false,
                 readAloud: false, side: 'red', coach: 'auto', freeText: true, talk: 'smart' };
let status = { mode: 'llm', reason: null, rank: '' };
let overCard = null, typing = null;

function push() {
  hud.setPhase({ phase: state.phase, canUndo: state.canUndo, hintLevel: state.hintLevel, failed: state.failed });
  app.dataset.phase = state.phase;
  for (const b of document.querySelectorAll('[data-phase-id]')) {
    b.setAttribute('aria-pressed', String(b.dataset.phaseId === (state.failed ? 'failed' : state.phase)));
  }
  $('#dev-level').value = String(state.hintLevel);
}
function set(phase, extra = {}) {
  Object.assign(state, { failed: false }, extra);
  state.phase = phase === 'failed' ? 'opponentTurn' : phase;
  if (phase === 'failed') state.failed = true;
  push();
}
function setTheme(id) {
  settings = { ...settings, theme: id };
  html.dataset.theme = id;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(html).getPropertyValue('--page').trim();
  for (const b of document.querySelectorAll('[data-theme-id]')) b.setAttribute('aria-pressed', String(b.dataset.themeId === id));
  hud.openSettings(settings, status);
}
function setMotion(mode) {
  html.dataset.motion = mode;
  figure?.setReducedMotion(mode !== 'full');
  for (const b of document.querySelectorAll('[data-motion-id]')) b.setAttribute('aria-pressed', String(b.dataset.motionId === mode));
}
function motionOf(pref) {
  return pref === 'auto' ? (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full') : pref;
}
function trophies() { hud.setTrophies(sample.mine.slice(0, state.mine), sample.lost.slice(0, state.lost)); }
function notate(plies) { state.plies = plies; hud.setNotation(rowsOf(plies), plies); }

function start(kind) {
  const opts = { first: { hasSave: false, firstVisit: true, canImport: false }, 'first-import': { hasSave: false, firstVisit: true, canImport: true },
                 resume: { hasSave: true, firstVisit: false, canImport: false }, again: { hasSave: false, firstVisit: false, canImport: false } }[kind];
  const done = hud.showStart(opts);
  done.then((choice) => {
    log(`showStart -> '${choice}'`);
    notate(choice === 'continue' ? 7 : 0);
    hud.setRound(choice === 'continue' ? 4 : 1);
    set('childTurn', { hintLevel: 0, canUndo: choice === 'continue' });
  });
  return done;
}

const board = [];                                 // OverView.proud.before is not drawn by the hud
const proud = { before: board, move: { from: { row: 7, col: 6 }, to: { row: 5, col: 5 }, piece: P('horse', 'red'), captured: null }, notation: '马三进四', self: true };
const overViews = {
  win: { result: 'win', reason: 'checkmate', byChildMate: true, stats: { rounds: 34, captures: 9, brilliant: 1 }, proud,
         rank: { to: 4, name: '初露锋芒' }, goal: sample.goal, kept: true, quiet: false },
  stalemate: { result: 'win', reason: 'stalemate', byChildMate: false, stats: { rounds: 52, captures: 12, brilliant: 0 }, proud: { ...proud, self: false },
               rank: null, goal: sample.goal, kept: null, quiet: false },
  loss: { result: 'loss', reason: 'checkmate', byChildMate: false, stats: { rounds: 27, captures: 5, brilliant: 1 }, proud,
          rank: null, goal: sample.goal, kept: false, quiet: false },
  draw: { result: 'draw', reason: 'repetition', byChildMate: false, stats: { rounds: 61, captures: 14, brilliant: 2 }, proud: null,
          rank: null, goal: null, kept: null, quiet: false },
  plain: { result: 'loss', reason: 'resign', byChildMate: false, stats: { rounds: 8, captures: 1, brilliant: 0 }, proud: null,
           rank: null, goal: null, kept: null, quiet: false },
  quiet: { result: 'win', reason: 'checkmate', byChildMate: true, stats: { rounds: 34, captures: 9, brilliant: 1 }, proud: null,
           rank: null, goal: null, kept: null, quiet: true },
};
function over(kind, { type = true } = {}) {
  clearInterval(typing);
  set('over', { canUndo: true });
  overCard = hud.showOver(overViews[kind]);
  const target = overCard.takeaway;
  const text = sample.takeaway;
  if (!type) return overCard;
  let i = 0;
  const begin = () => {                            // the coach's line arrives a moment later and types itself in
    if (html.dataset.motion !== 'full') { target.textContent = text; return; }
    typing = setInterval(() => { target.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 28);
  };
  setTimeout(begin, 900);
  return overCard;
}
function sheet(kind) {
  hud.closeAll();
  $('#menu-button').click();
  document.querySelector(`.hud-menu__item[data-menu="${kind}"]`).click();
}

// ---- what the stage would do with the hud's events ----
app.addEventListener('hud:action', (event) => {
  const { action } = event.detail;
  log(`hud:action ${JSON.stringify(event.detail)}`);
  if (action === 'mute') { state.muted = !state.muted; hud.setMuted(state.muted); }
  else if (action === 'hint') { set(state.phase, { hintLevel: Math.min(3, state.hintLevel + 1) }); }
  else if (action === 'confirm') {
    notate(state.plies + 1);
    set('opponentTurn', { canUndo: true });
    setTimeout(() => { if (state.phase === 'opponentTurn' && !state.failed) { notate(state.plies + 1); hud.setRound(++state.round); set('childTurn', { hintLevel: 0 }); } }, 1400);
  }
  else if (action === 'retract') set('selected');
  else if (action === 'undo') {
    if (state.phase === 'tentative') set('selected');
    else { notate(Math.max(0, state.plies - (state.phase === 'opponentTurn' ? 1 : 2))); set('childTurn', { hintLevel: 0, canUndo: state.plies > 0 }); }
  }
  else if (action === 'retry-opponent') set('opponentTurn');
  else if (action === 'retry-engine') setTimeout(() => hud.blocking(null), 700);
  else if (action === 'resign') hud.confirm('resign').then((yes) => { log(`confirm('resign') -> ${yes}`); if (yes) over('plain'); });
  else if (action === 'new-game') {
    const begin = (color) => { notate(0); state.round = 1; hud.setRound(1); state.mine = state.lost = 0; trophies(); set(color === 'black' ? 'opponentTurn' : 'childTurn', { hintLevel: 0, canUndo: false }); };
    if (state.phase === 'over' || state.phase === 'boot') begin(settings.side);
    else hud.newGameDialog().then((r) => { log(`newGameDialog() -> ${JSON.stringify(r)}`); if (r) begin(r.humanColor); });
  }
});
app.addEventListener('hud:setting', (event) => {
  const { key, value } = event.detail;
  log(`hud:setting ${JSON.stringify(event.detail)}`);
  settings = { ...settings, [key]: value };
  if (key === 'theme') setTheme(value);
  if (key === 'motion') setMotion(motionOf(value));
  if (key === 'coach') status = value === 'local' ? { ...status, mode: 'local', reason: 'setting' } : { ...status, mode: 'llm', reason: null };
  hud.openSettings(settings, status);                // the stage hands the new data back
});
app.addEventListener('hud:import', (event) => log(`hud:import {text: ${event.detail.text.length} chars}`));

// ---- the panel ----
$('#dev').addEventListener('click', (event) => {
  const b = event.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.themeId) setTheme(d.themeId);
  else if (d.motionId) setMotion(d.motionId);
  else if (d.phaseId) set(d.phaseId);
  else if (d.start) start(d.start);
  else if (d.over) over(d.over === 'quiet' ? 'quiet' : d.over);
  else if (d.sheet) sheet(d.sheet);
  else if (d.do === 'nudge') hud.nudgeHint();
  else if (d.do === 'beacon') hud.beaconConfirm();
  else if (d.do === 'round1') hud.setRound(state.round = 1);
  else if (d.do === 'round+') hud.setRound(++state.round);
  else if (d.do === 'round37') hud.setRound(state.round = 37);
  else if (d.do === 'trophy0') { state.mine = state.lost = 0; trophies(); }
  else if (d.do === 'trophy3') { state.mine = 3; state.lost = 1; trophies(); }
  else if (d.do === 'trophy9') { state.mine = 9; state.lost = 7; trophies(); }
  else if (d.do === 'trophy+') { state.mine = Math.min(9, state.mine + 1); trophies(); }
  else if (d.do === 'mute') hud.setMuted(state.muted = !state.muted);
  else if (d.do === 'rival-say') rival.set({ mood: 'smug', line: '这一步，你可看懂了？' });      // the plate's speech tag beside the round and the trophies
  else if (d.do === 'rival-think') rival.set({ mood: 'thinking' });
  else if (d.do === 'rival-calm') rival.set({ mood: 'calm' });
  else if (d.do === 'rows0') notate(0);
  else if (d.do === 'rows3') notate(3);
  else if (d.do === 'rows41') notate(41);
  else if (d.do === 'over-close') overCard?.close();
  else if (d.do === 'menu') $('#menu-button').click();
  else if (d.do === 'resign') hud.confirm('resign').then((yes) => log(`confirm('resign') -> ${yes}`));
  else if (d.do === 'newgame') hud.newGameDialog().then((r) => log(`newGameDialog() -> ${JSON.stringify(r)}`));
  else if (d.do === 'toast') hud.toast('已经回到开局啦，没有可以悔的棋。');
  else if (d.do === 'toast-long') hud.toast('这个浏览器不让存档，关掉页面后棋局不会保留。', { ms: 4000 });
  else if (d.do === 'block') hud.blocking({ kind: 'engine-dead' });
  else if (d.do === 'closeall') hud.closeAll();
});
$('#dev-undo').addEventListener('change', (event) => set(state.failed ? 'failed' : state.phase, { canUndo: event.target.checked, failed: state.failed }));
$('#dev-level').addEventListener('change', (event) => set(state.failed ? 'failed' : state.phase, { hintLevel: Number(event.target.value), failed: state.failed }));
$('#dev-figure').addEventListener('change', (event) => coachFigure(event.target.value));
function syncStatus() {
  const [mode, reason] = $('#dev-coach').value.split(':');
  status = { mode, reason: reason || null, rank: $('#dev-rank').value };
  app.dataset.coach = mode;
  hud.openSettings(settings, status);
}
$('#dev-coach').addEventListener('change', syncStatus);
$('#dev-rank').addEventListener('change', syncStatus);

// ---- boot ----
setTheme(['chibi', 'longzhong', 'shachang'].includes(query.get('theme')) ? query.get('theme') : 'chibi');
setMotion(query.get('motion') === 'reduced' || query.get('motion') === 'full' ? query.get('motion') : motionOf('auto'));
if (query.get('panel') === '0') $('#dev').hidden = true;
coachFigure(query.get('figure'));
hud.setRound(1);
hud.openSettings(settings, status);
notate(0);
set('childTurn', { canUndo: false });
log(`ready · TXT keys: ${Object.keys(TXT).join(' ')}`);

window.__dev = { hud, rival, set, start, over, sheet, coachFigure, notate, trophies, setTheme, setMotion, syncStatus, state, sample, played, overViews,
                 get settings() { return settings; }, get status() { return status; } };
